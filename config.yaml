# ════════════════════════════════════════════════════════════════════════════
#  Anatomía de una Falla · Parte II — configuración única del proyecto
#  Todo parámetro del análisis vive acá: el código no tiene valores a mano.
#  La carpeta de datos se toma de la variable NCMAPSS_DATA_DIR (.env).
# ════════════════════════════════════════════════════════════════════════════

seed: 42

report:
  team: ["López Marsico Verónica", "Acciardi Juan", "Naón Pedro", "Giannice Agustín"]
  # Quién presenta cada sección de la versión corta (1 = EDA, 2 = Línea 1, 3 = Línea 2, 4 = Línea 3 + cierre)
  presenters: ["López Marsico Verónica", "Acciardi Juan", "Naón Pedro", "Giannice Agustín"]
  # Las tres líneas de investigación propuestas por el profesor (texto de la devolución, tal cual)
  professor_lines:
    - title: "Predicción de vida útil con incertidumbre"
      models: "Temporal Fusion Transformer + CatBoost + Adaptive Conformal Prediction"
      novelty: "Predecir cuántos vuelos o ciclos le quedan al motor, incorporando intervalos de incertidumbre y controlando especialmente el riesgo de sobreestimar su vida útil."
      application: "Mantenimiento predictivo con estimaciones más confiables para planificar inspecciones."
    - title: "Que generaliza entre diferentes tipos de vuelo"
      models: "Domain-Adversarial Neural Networks + PatchTST + Transfer Learning"
      novelty: "Evaluar si un modelo entrenado con perfiles de vuelos cortos puede estimar correctamente la degradación en vuelos medianos o largos, separando el desgaste de los efectos operativos."
      application: "Sistemas predictivos más robustos frente a cambios de rutas y condiciones de operación."
    - title: "Detección temprana del desgaste antes de la falla"
      models: "Self-Supervised Transformers + Masked Autoencoders + Change Point Detection"
      novelty: "Identificar señales iniciales de degradación utilizando patrones de sensores, incluso cuando todavía no se observa una caída significativa de rendimiento."
      application: "Generar alertas tempranas de deterioro sin depender exclusivamente de la predicción del RUL."

data:
  default_dir: C:\datos\ncmapss       # se usa sólo si no existe NCMAPSS_DATA_DIR
  file_glob: "N-CMAPSS_DS*.h5"
  chunk_rows: 2000000                 # filas por bloque al leer los .h5 (cuida la RAM)
  seconds_sample_frac: 0.02           # fracción de segundos que se guarda para EDA y modelo sano
  example_flight: {dataset: DS02, unit: 2, cycle: 1}    # vuelo usado para ilustrar un perfil (el mismo de la Parte I)

# Modo rápido (python scripts/run_all.py --sample): prueba todo el pipeline en minutos
sample:
  datasets: [DS02, DS05]
  max_units_per_split: 4
  seconds_sample_frac: 0.01
  example_flight: {dataset: DS02, unit: 2, cycle: 1}
  example_unit: {dataset: DS02, unit: 2}

flight_classes:                       # nombres; las duraciones se calculan desde los datos
  1: corto
  2: mediano
  3: largo

# Parámetros del análisis exploratorio (umbrales y tamaños de los gráficos)
eda:
  component_loss_threshold_pct: 0.05  # un componente "se desgasta" si pierde más que esto en su vida
  trend_window: 80                    # vuelos finales que se muestran en la cuenta regresiva
  envelope_bins: 40
  high_alt_ft: 25000                  # umbral para "vuelo alto" en la envolvente
  plot_downsample_s: 10               # 1 punto cada N segundos en los perfiles de vuelo
  scatter_points: 6000
  outlier_z: 5.0                      # |z| respecto de los vuelos sanos para considerar un vuelo extremo
  corr_strong: 0.95
  z_alarm: 2.0                        # residuo (en desvíos sanos) considerado "fuera de lo normal"
  life_bins: 20                       # tramos de vida para la evolución de los sensores
  edge_flights: 5                     # vuelos iniciales / finales para medir la deriva de T48
  example_unit: {dataset: DS01, unit: 1}   # motor usado para mostrar "antes y después" del residuo

# Modelo de "motor sano": predice cada sensor a partir de las 4 condiciones de vuelo
health_model:
  hidden: [128, 128, 64]
  steps: 12000                        # pasos de optimización (independiente del tamaño de la muestra)
  steps_sample: 3000
  batch_size: 4096
  lr: 0.002
  max_train_rows: 1500000

# Partición sin fuga: se divide por MOTOR. El test oficial de NASA queda intacto.
split:
  calib_frac: 0.20                    # motores de desarrollo reservados para calibrar la incertidumbre
  val_frac: 0.15                      # motores de desarrollo para early stopping

features:
  rolling_windows: [5, 10]            # ventanas (en vuelos) de medias y pendientes móviles, sólo hacia atrás

catboost:
  iterations: 3000
  iterations_sample: 300
  learning_rate: 0.03
  depth: 6
  quantiles: [0.05, 0.5, 0.95]
  early_stopping_rounds: 200

tft:
  max_encoder_length: 20
  hidden_size: 32
  attention_head_size: 4
  dropout: 0.15
  hidden_continuous_size: 16
  learning_rate: 0.003
  batch_size: 128
  max_epochs: 80
  max_epochs_sample: 3
  patience: 10
  quantiles: [0.05, 0.5, 0.95]
  feature_set: all                    # all · smooth (medias y pendientes) · delta (residuo − línea base por vuelo)
  # Búsqueda chica de hiperparámetros: se elige la de menor pérdida en VALIDACIÓN (nunca en test).
  # En modo rápido sólo se prueba la primera.
  search:
    - {}
    - {hidden_size: 16, dropout: 0.2}
    - {hidden_size: 64, learning_rate: 0.001, dropout: 0.2}
    - {feature_set: smooth}
    - {feature_set: smooth, learning_rate: 0.001, dropout: 0.3}
    - {feature_set: delta, max_encoder_length: 30}
    - {feature_set: delta, max_encoder_length: 30, hidden_size: 64, learning_rate: 0.001}
    - {max_encoder_length: 10, learning_rate: 0.001}

conformal:
  alpha: 0.10                         # 90 % de cobertura objetivo
  alpha_over: 0.03                    # parte del error permitida para SOBREESTIMAR (cola peligrosa)
  alpha_under: 0.07                   # parte permitida para subestimar (cola conservadora)
  aci_gamma: 0.05                     # paso de aprendizaje de Adaptive Conformal Inference
  fleet_permutations: 30              # órdenes de llegada de motores simulados para el ACI de flota

results:
  eval_min_cycle: 2                   # el TFT necesita 1 vuelo de historia: ambos modelos se evalúan desde el vuelo 2
  rul_buckets: [0, 10, 25, 50, 75, 1000]
  n_example_engines: 8

nasa_score: {a_under: 13.0, a_over: 10.0}   # s = exp(-d/13)-1 si d<0 · exp(d/10)-1 si d>0, d = pred - real

line2:
  control_draws: 5                    # sorteos del control "mismos motores, todas las clases"

line3:                                # detección temprana (change point)
  baseline_flights: 10                # vuelos iniciales que definen la referencia sana
  cusum_k: 0.5                        # holgura del CUSUM (en desvíos estándar)
  target_false_alarm: 0.10            # cada detector se calibra en motores de DESARROLLO para esta tasa de falsas alarmas
  cusum_h_grid: [1, 60, 120]          # umbrales candidatos del CUSUM (inicio, fin, cantidad)
  t48_z_grid: [0.5, 15, 120]          # umbrales candidatos para el residuo de T48
  pelt_penalty_grid: [1, 200, 120]    # penalidades candidatas de PELT
